services:
  ofsm:
    build:
      context: .
      dockerfile: Dockerfile
    image: factorio-manager
    container_name: factorio-manager_ofsm
    restart: unless-stopped

    ports:
      - "34197:34197/udp"
      - "127.0.0.1:7090:80"

    environment:
      FACTORIO_VERSION: ${FACTORIO_VERSION:-2.1.21}
      # Required: the manager refuses to start if any of these is missing.
      ADMIN_USER: ${ADMIN_USER:?ADMIN_USER is required}
      ADMIN_PASS: ${ADMIN_PASS:?ADMIN_PASS is required}
      RCON_PASS: ${RCON_PASS:?RCON_PASS is required}
      COOKIE_ENCRYPTION_KEY: ${COOKIE_ENCRYPTION_KEY:?COOKIE_ENCRYPTION_KEY is required}

    volumes:
      - ./fsm-data:/opt/fsm-data
      - ./factorio:/opt/factorio

    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # The manager answers on port 80 inside the container; the first start
      # downloads Factorio, which takes a while, hence the long start period.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
